[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lbm-lab"
version = "0.1.0"
description = "Research workspace for lattice Boltzmann method simulations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "pandas>=2.0",
  "streamlit>=1.36",
  "PySide6>=6.7",
  "pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
lbm-run = "lbm_lab.runner:main"
lbm-init-db = "lbm_lab.db:main"
lbm-custom-run = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
